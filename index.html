<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regístrate — StandIA</title>
</head>

<body style="font-family:sans-serif;max-width:400px;margin:auto;padding:20px">

<h2>Registro</h2>

<input id="f-name" placeholder="Nombre"><br><br>
<input id="f-email" placeholder="Email"><br><br>
<input id="f-phone" placeholder="Teléfono"><br><br>
<input id="f-company" placeholder="Empresa"><br><br>
<input id="f-cargo" placeholder="Cargo"><br><br>

<button onclick="submitLead()">Enviar</button>

<script>
async function submitLead() {
  const now = new Date();

  const data = {
    nombre: document.getElementById('f-name').value,
    email: document.getElementById('f-email').value,
    telefono: document.getElementById('f-phone').value,
    empresa: document.getElementById('f-company').value,
    cargo: document.getElementById('f-cargo').value,
    fecha: now.toLocaleDateString(),
    hora: now.toLocaleTimeString(),
    timestamp: now.toISOString()
  };

  const formData = new FormData();
  formData.append("data", JSON.stringify(data));

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbwJ3mqmjdY6pMR4ZTnJTAKB3SHJrA5nuVfgbTE4izn5u90rAS1rdkNbp1WRbxWGA3I-/exec", {
      method: "POST",
      body: formData
    });

    const text = await response.text();
    console.log("RESPUESTA:", text);

    alert("✅ Guardado en Google Sheets");

  } catch (error) {
    console.log("Offline:", error);

    const local = JSON.parse(localStorage.getItem("pendientes") || "[]");
    local.push(data);
    localStorage.setItem("pendientes", JSON.stringify(local));

    alert("⚠️ Sin internet. Guardado local.");
  }
}
</script>

</body>
</html>
